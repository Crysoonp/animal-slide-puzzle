<!DOCTYPE html>
<html lang="ja">




<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Puzzle</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap"
        rel="stylesheet">

</head>

















<body>





























    <div id="title-screen">

        <img src="images/title.jpg" alt="タイトル画像" id="title-image">

        <button class="start-button title-start-button" onclick="startTitleGame()">

            🎮 START!

        </button>

    </div>










    <div id="game-screen">

        <div id="difficulty-container" class="difficulty-buttons">

            <button id="diff-3" onclick="setDifficulty(3)">
                😊 初級
            </button>

            <button id="diff-4" onclick="setDifficulty(4)">
                😎 中級
            </button>

            <button id="diff-5" onclick="setDifficulty(5)">
                🔥 上級
            </button>

            <button id="diff-6" onclick="setDifficulty(6)">
                👹 超級
            </button>

        </div>

        <div class="main-actions">

            <button id="cancel-button" class="cancel-button" onclick="cancelGame()" style="display: none;">
                ⏹ 中止
            </button>

            <button id="start-button" class="start-button" onclick="shuffle()" disabled>
                🎮 ゲーム開始
            </button>

            <button class="settings-button" onclick="toggleSettings()">
                ⚙️
            </button>

        </div>





        <div class="info-container">

            <div class="info-panel">

                <p id="moves">
                    🎯 移動回数: 0
                </p>

                <p id="timer">
                    ⏰ 経過時間: 00:00
                </p>

            </div>

            <div class="record-panel">

                <p id="best">
                    🥇 最少移動回数: -
                </p>

                <p id="best-time">
                    ⭐ 最短時間: -
                </p>

            </div>

        </div>



        <div id="settings-menu" style="display: none;">

            <div id="settings-content">

                <h2>
                    ⚙️ 設定
                </h2>

                <button onclick="resetBestScore()">
                    最少移動回数をリセット
                </button>

                <button onclick="resetBestTime()">
                    最短時間をリセット
                </button>

                <button class="danger-button" onclick="resetAllRecords()">
                    全記録をリセット
                </button>

                <button class="settings-close-button" onclick="closeSettings()">
                    閉じる
                </button>

            </div>

        </div>







        <div class="stats">
        </div>

        <div id="game"></div>

<div class="utility-buttons">

    <button
        id="original-button"
        onclick="toggleOriginal()">

        🖼️ 完成図

    </button>

</div>


<div id="original-container"
     style="display: none;">

    <div id="original-content">

        <h2>
            🖼️ 完成図
        </h2>

        <img
            id="original-image"
            src="images/cat.jpg"
            alt="完成lick="closeOriginal()">

            閉じる

        </button>

    </div>

</div>


<div id="message"></div>


<div id="clear-panel"
     style="display: none;">

    <div id="clear-content">

        <div id="clear-stats">

            <span id="clear-moves"></span>

            <span id="clear-time"></span>

        </div>

        <h2 id="clear-title">
            🎉 CLEAR! 🎉
        </h2>

        <div id="clear-buttons">

            <button onclick="closeClearPanel()">
                OK
            </button>

            <button onclick="playAgain()">
                🎮 もう一回遊ぶ
            </button>

        </div>

    </div>

</div>


</div>


<script src="game.js"></script>

</body>

</html>
